name: reproduce

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Tests (offline)
        run: python -m pytest -q tests
      - name: Offline reproduction of the README figures
        run: bash scripts/reproduce_offline.sh
